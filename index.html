<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재료과학 인터랙티브 시뮬레이터 포털 (Materials Science Virtual Lab Suite)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .tab-btn.active {
      background-color: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #93c5fd;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Main Top Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur z-50 px-5 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-purple-500/20">
        <i data-lucide="flask-conical" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">MatSci Lab Suite</span>
          <h1 class="text-base font-bold text-white tracking-tight">재료과학 가상 실험실 & 시뮬레이터</h1>
        </div>
        <p class="text-[11px] text-slate-400">재료과학 핵심 모형 인터랙티브 웹 시뮬레이션 패키지</p>
      </div>
    </div>

    <!-- Tab Switcher Navigation (Only 3 Simulation Modules) -->
    <nav class="flex items-center gap-1.5 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
      <button class="tab-btn active px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 border border-transparent transition" data-target="sim1">
        <i data-lucide="atom" class="w-4 h-4 text-emerald-400"></i>
        <span>1. 결합에너지 & 열팽창</span>
      </button>

      <button class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center gap-2 border border-transparent transition" data-target="sim2">
        <i data-lucide="scale" class="w-4 h-4 text-blue-400"></i>
        <span>2. UTM 인장 & 응력-변형률</span>
      </button>

      <button class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 flex items-center gap-2 border border-transparent transition" data-target="sim3">
        <i data-lucide="box" class="w-4 h-4 text-purple-400"></i>
        <span>3. 3D 결정구조 & 밀러(밀러-브라베)지수</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-2">
      <button id="btnOpenNewTab" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">현재 모듈 단독 창으로 열기</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport (Iframes for modular isolation) -->
  <main class="flex-1 relative w-full h-full overflow-hidden bg-slate-950">
    <!-- Sim 1 Iframe -->
    <iframe id="iframeSim1" src="sim1_lennard_jones.html" class="w-full h-full border-none block"></iframe>
    
    <!-- Sim 2 Iframe -->
    <iframe id="iframeSim2" src="sim2_utm_tensile_test.html" class="w-full h-full border-none hidden"></iframe>
    
    <!-- Sim 3 Iframe -->
    <iframe id="iframeSim3" src="sim3_3d_crystallography.html" class="w-full h-full border-none hidden"></iframe>
  </main>

  <script>
    lucide.createIcons();

    const tabs = document.querySelectorAll('.tab-btn');
    const iframeSim1 = document.getElementById('iframeSim1');
    const iframeSim2 = document.getElementById('iframeSim2');
    const iframeSim3 = document.getElementById('iframeSim3');
    const btnOpenNewTab = document.getElementById('btnOpenNewTab');

    let currentTarget = 'sim1';

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.classList.remove('active');
          t.classList.add('text-slate-400');
        });
        tab.classList.add('active');
        tab.classList.remove('text-slate-400');

        const target = tab.getAttribute('data-target');
        currentTarget = target;

        // Hide all views
        iframeSim1.classList.add('hidden');
        iframeSim2.classList.add('hidden');
        iframeSim3.classList.add('hidden');

        // Show target
        if (target === 'sim1') {
          iframeSim1.classList.remove('hidden');
        } else if (target === 'sim2') {
          iframeSim2.classList.remove('hidden');
        } else if (target === 'sim3') {
          iframeSim3.classList.remove('hidden');
        }
      });
    });

    btnOpenNewTab.addEventListener('click', () => {
      let file = 'sim1_lennard_jones.html';
      if (currentTarget === 'sim2') file = 'sim2_utm_tensile_test.html';
      if (currentTarget === 'sim3') file = 'sim3_3d_crystallography.html';
      window.open(file, '_blank');
    });
  </script>
</body>
</html>
